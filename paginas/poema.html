<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Poema - Você, Minha Deusa</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/poema.css">
</head>
<body>
    <main class="container">
        <section class="poema-wrapper">
            <div class="poema-card">
                <div id="conteudo-poema" class="texto-poema" aria-live="polite">
                    <noscript>
                        <p>eu quero conhecer você<br><br>
                        até nas coisas que ninguém percebe. quero saber como fica teu rosto quando tenta segurar o choro, qual música você escuta escondida, o que te faz sorrir quando o dia foi horrível.<br><br>
                        quero aprender teus silêncios, teus medos, até as manias que você acha irritantes.<br><br>
                        e quero que você entenda uma coisa. não precisa ser fácil de amar todos os dias. não precisa estar bonita, feliz ou com tudo resolvido.<br><br>
                        porque eu não quero uma mulher perfeita. eu quero você.<br><br>
                        e se existem mil maneiras<br>
                        de você ser quem é,<br>
                        eu quero ter a sorte<br>
                        de me apaixonar<br>
                        mil vezes pela mesma mulher.</p>
                    </noscript>
                </div>
                <button id="btn-pular-animacao" class="btn-secundario">se quiser ver tudo, impaciente</button>
            </div>
        </section>
    </main>
